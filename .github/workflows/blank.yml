import os, zipfile, shutil

base="/mnt/data/sagar_mart_flutter"
workflow_dir=os.path.join(base,".github","workflows")
os.makedirs(workflow_dir, exist_ok=True)

workflow="""name: Build Sagar Mart APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sagar-mart-apk
          path: build/app/outputs/flutter-apk/app-release.apk
"""
with open(os.path.join(workflow_dir,"build.yml"),"w",encoding="utf-8") as f:
    f.write(workflow)

readme2=os.path.join(base,"MOBILE_BUILD_GUIDE.md")
with open(readme2,"w",encoding="utf-8") as f:
    f.write("""# Mobile-only APK build

This project includes a GitHub Actions workflow. You can build the APK from an Android phone without a PC.

1. Create/sign in to a GitHub account.
2. Create a new repository named `sagar-mart`.
3. Upload all files/folders from this project ZIP to the repository (including `.github/workflows/build.yml`).
4. Open the repository's **Actions** tab.
5. Open **Build Sagar Mart APK**.
6. Tap **Run workflow** if it has not started automatically.
7. Wait for the green check to appear.
8. Open the completed workflow run and scroll to **Artifacts**.
9. Download `sagar-mart-apk`.
10. Extract it and install `app-release.apk` on your Android phone.

If GitHub asks for permission to run workflows, allow it.

Important: the first build can take several minutes. Android may ask you to allow installation from the browser/file manager.
""")

zip_path="/mnt/data/Sagar_Mart_Mobile_Build_Project.zip"
if os.path.exists(zip_path): os.remove(zip_path)
with zipfile.ZipFile(zip_path,"w",zipfile.ZIP_DEFLATED) as z:
    for root, dirs, files in os.walk(base):
        for fn in files:
            p=os.path.join(root,fn)
            z.write(p, os.path.relpath(p, os.path.dirname(base)))
print(zip_path)
# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "SAGAR-MART" branch
  push:
    branches: [ "SAGAR-MART" ]
  pull_request:
    branches: [ "SAGAR-MART" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

